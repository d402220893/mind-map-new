<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>备注弹窗 v2.0.46 视觉预览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #e8eaf0;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  /* ══ 弹窗容器（对应 .nodeNoteDialog）══ */
  .dialog {
    width: 480px;
    background: #fff;
    border-radius: 12px;
    border: none;
    box-shadow: 0 12px 40px rgba(0,0,0,0.08);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  /* header */
  .dlgHeader {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 16px 10px;
  }
  .noteTitle { font-size: 16px; font-weight: 700; color: #1e2a3a; }
  .modeSwitch { display: inline-flex; align-items: center; gap: 14px; margin-left: auto; padding-right: 14px; }
  .modeBtn {
    border: none; background: transparent; padding: 2px 0;
    font-size: 13px; line-height: 20px; color: #8a919f;
    cursor: pointer; font-family: inherit;
  }
  .modeBtn.active { color: #409eff; font-weight: 600; }
  .closeBtn {
    border: none; background: transparent; cursor: pointer;
    font-size: 16px; color: #8a919f; line-height: 1; padding: 4px;
    border-radius: 4px;
  }
  .closeBtn:hover { color: #1e2a3a; background: rgba(0,0,0,0.05); }
  /* body：纯白无框编辑区 */
  .dlgBody { padding: 4px 16px 8px; }
  .noteBox {
    border: none; border-radius: 8px; background: #fff; overflow: hidden;
  }
  .noteEditor {
    min-height: 220px; max-height: 44vh; overflow-y: auto;
    padding: 8px 4px; font-size: 14px; line-height: 1.7; color: #1e2a3a;
    outline: none;
  }
  /* footer 单行 */
  .dlgFooter {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 6px 16px 14px;
  }
  .footLeft, .footRight { display: flex; align-items: center; gap: 8px; }
  .codeLangSelect {
    height: 28px; font-size: 13px; padding: 0 8px;
    border: 1px solid #dcdfe6; border-radius: 6px;
    background: #fff; color: #1e2a3a; outline: none; font-family: inherit;
  }
  .btn {
    height: 28px; padding: 0 14px; font-size: 13px; font-family: inherit;
    border: 1px solid #dcdfe6; border-radius: 6px; background: #fff;
    color: #1e2a3a; cursor: pointer;
  }
  .btn:hover { color: #409eff; border-color: #b3d8ff; background: #ecf5ff; }
  .btn.primary { background: #409eff; border-color: #409eff; color: #fff; }
  .btn.primary:hover { background: #66b1ff; border-color: #66b1ff; color: #fff; }
  .shortcutHint { font-size: 12px; color: #a0a6b1; user-select: none; }
</style>
</head>
<body>
  <div class="dialog">
    <div class="dlgHeader">
      <span class="noteTitle">备注</span>
      <div class="modeSwitch">
        <button class="modeBtn active">写备注</button>
        <button class="modeBtn">引用章节</button>
      </div>
      <button class="closeBtn">✕</button>
    </div>
    <div class="dlgBody">
      <div class="noteBox">
        <div class="noteEditor">小的盒式设备可以测sodimm，但是单设备也只能支持到2dimms或者4dimms，无法支持很多。</div>
      </div>
    </div>
    <div class="dlgFooter">
      <div class="footLeft">
        <select class="codeLangSelect"><option>python</option></select>
        <button class="btn">插入代码块</button>
      </div>
      <div class="footRight">
        <span class="shortcutHint">(Ctrl+Enter)</span>
        <button class="btn">取消</button>
        <button class="btn primary">确定</button>
      </div>
    </div>
  </div>
</body>
</html>
