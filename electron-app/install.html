<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<title>思绪思维导图 安装程序</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f5f6fa;
    color: #2c3e50;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #5b8def 0%, #3a6fd8 100%);
    color: #fff;
    padding: 26px 32px 22px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .logo {
    width: 48px; height: 48px; border-radius: 12px;
    background: rgba(255,255,255,0.18);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
  .header h1 { font-size: 20px; font-weight: 600; letter-spacing: 1px; }
  .header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
  .body { flex: 1; padding: 24px 32px; overflow-y: auto; }
  .section-title { font-size: 14px; font-weight: 600; color: #3a6fd8; margin-bottom: 14px; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .row > label { font-size: 13px; color: #555; width: 72px; flex-shrink: 0; }
  .path-box {
    flex: 1; display: flex; align-items: center;
    background: #fff; border: 1px solid #d8dee9; border-radius: 8px;
    padding: 9px 12px; font-size: 13px; color: #333;
  }
  .path-box input {
    border: none; outline: none; width: 100%; font-size: 13px; color: #333; background: transparent;
  }
  .btn {
    border: none; border-radius: 8px; cursor: pointer; font-size: 13px;
    padding: 9px 16px; transition: all 0.15s; font-family: inherit;
  }
  .btn-browse { background: #eef2fb; color: #3a6fd8; white-space: nowrap; }
  .btn-browse:hover { background: #e2e9f8; }
  .checks { display: flex; flex-direction: column; gap: 12px; padding-left: 4px; }
  .check { display: flex; align-items: center; gap: 9px; font-size: 13px; color: #444; cursor: pointer; }
  .check input { width: 16px; height: 16px; accent-color: #3a6fd8; cursor: pointer; }
  .hint { font-size: 12px; color: #97a2b3; margin-top: 4px; }
  .progress-wrap { margin-top: 8px; display: none; }
  .progress-track {
    height: 10px; background: #e6eaf2; border-radius: 6px; overflow: hidden;
  }
  .progress-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #5b8def, #3a6fd8);
    transition: width 0.2s ease;
  }
  .progress-text { font-size: 12px; color: #6b7686; margin-top: 8px; display: flex; justify-content: space-between; }
  .footer {
    border-top: 1px solid #e6eaf2; padding: 16px 32px;
    display: flex; align-items: center; justify-content: flex-end; gap: 12px;
    background: #fff;
  }
  .btn-primary { background: #3a6fd8; color: #fff; padding: 10px 28px; font-weight: 500; }
  .btn-primary:hover { background: #2f5fc0; }
  .btn-primary:disabled { background: #a9bce8; cursor: not-allowed; }
  .btn-ghost { background: #fff; color: #6b7686; border: 1px solid #d8dee9; padding: 10px 22px; }
  .btn-ghost:hover { background: #f3f5f9; }
  .done-box {
    display: none; text-align: center; padding: 18px 0;
  }
  .done-box .tick {
    width: 56px; height: 56px; border-radius: 50%; background: #2ecc71;
    color: #fff; font-size: 30px; display: flex; align-items: center; justify-content: center;
    margin: 0 auto 14px;
  }
  .done-box h2 { font-size: 17px; color: #2c3e50; margin-bottom: 6px; }
  .done-box p { font-size: 13px; color: #7a8699; }
  .err { color: #e74c3c; font-size: 13px; margin-top: 10px; display: none; }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">🧠</div>
    <div>
      <h1>思绪思维导图</h1>
      <p>安装程序 · 多工作表离线版</p>
    </div>
  </div>

  <div class="body">
    <div id="mainPane">
      <div class="section-title">安装选项</div>
      <div class="row">
        <label>安装位置</label>
        <div class="path-box">
          <input id="pathInput" type="text" placeholder="请选择安装目录" />
        </div>
        <button class="btn btn-browse" id="browseBtn">浏览…</button>
      </div>
      <div class="checks">
        <label class="check"><input type="checkbox" id="chkDesktop" checked /> 创建桌面快捷方式</label>
        <label class="check"><input type="checkbox" id="chkStart" checked /> 创建开始菜单快捷方式</label>
        <label class="check"><input type="checkbox" id="chkRun" checked /> 安装完成后立即运行</label>
      </div>
      <div class="hint">默认安装到当前用户的「AppData\Local\MindMap」目录，无需管理员权限。</div>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
        <div class="progress-text"><span id="progressPhase">准备中…</span><span id="progressPct">0%</span></div>
      </div>
      <div class="err" id="errBox"></div>
    </div>

    <div class="done-box" id="doneBox">
      <div class="tick">✓</div>
      <h2>安装完成</h2>
      <p id="doneText">思绪思维导图 已成功安装到您的电脑。</p>
    </div>
  </div>

  <div class="footer">
    <button class="btn btn-ghost" id="cancelBtn">取消</button>
    <button class="btn btn-primary" id="installBtn">安装</button>
    <button class="btn btn-primary" id="finishBtn" style="display:none;">完成</button>
  </div>

<script>
  const $ = id => document.getElementById(id)
  let installing = false
  const api = window.smmApi

  function showError(msg) {
    const e = $('errBox'); e.textContent = msg; e.style.display = 'block'
  }
  function hideError() { $('errBox').style.display = 'none' }

  async function init() {
    try {
      const def = await api.installGetDefaultPath()
      if (def) $('pathInput').value = def
    } catch (e) {}
    api.onInstallProgress(p => {
      const wrap = $('progressWrap')
      wrap.style.display = 'block'
      const pct = Math.max(0, Math.min(100, p.pct || 0))
      $('progressBar').style.width = pct + '%'
      $('progressPct').textContent = pct + '%'
      const phase = {
        start: '开始安装…',
        copy: '正在复制文件…',
        runtime: '正在安装运行库…',
        done: '即将完成…'
      }[p.phase] || '安装中…'
      $('progressPhase').textContent = phase + (p.total ? ' (' + (p.done||0) + '/' + p.total + ')' : '')
    })
    api.onInstallDone(r => {
      installing = false
      if (r && r.ok) {
        $('mainPane').style.display = 'none'
        $('doneBox').style.display = 'block'
        $('installBtn').style.display = 'none'
        $('cancelBtn').style.display = 'none'
        $('finishBtn').style.display = 'inline-block'
        const run = $('chkRun').checked
        $('doneText').textContent = run
          ? '思绪思维导图 已成功安装，程序已为您启动。'
          : '思绪思维导图 已成功安装到您的电脑。'
      } else {
        showError('安装失败：' + ((r && r.error) || '未知错误'))
        $('installBtn').disabled = false
        $('installBtn').textContent = '重试'
      }
    })
  }

  $('browseBtn').onclick = async () => {
    try {
      const r = await api.installBrowse()
      if (r && !r.canceled && r.path) $('pathInput').value = r.path
    } catch (e) { showError('无法打开目录选择：' + e.message) }
  }

  $('installBtn').onclick = async () => {
    hideError()
    const target = ($('pathInput').value || '').trim()
    if (!target) { showError('请先选择安装目录'); return }
    installing = true
    $('installBtn').disabled = true
    $('browseBtn').disabled = true
    $('progressWrap').style.display = 'block'
    $('progressPhase').textContent = '开始安装…'
    try {
      await api.installDo(target, {
        desktop: $('chkDesktop').checked,
        startMenu: $('chkStart').checked,
        run: $('chkRun').checked
      })
    } catch (e) {
      showError('安装启动失败：' + e.message)
      $('installBtn').disabled = false
      installing = false
    }
  }

  $('cancelBtn').onclick = () => { if (!installing) api.installQuit() }
  $('finishBtn').onclick = () => api.installQuit()

  init()
</script>
</body>
</html>
